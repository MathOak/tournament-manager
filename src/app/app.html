<div class="app-shell" [class.display-shell]="displayMode()">
  @if (!displayMode()) {
    <app-header [theme]="theme()" (themeToggle)="toggleTheme()" />
  }
  <app-toast [message]="store.notice()" (dismissed)="store.dismissNotice()" />
  <main class="page-container" [class.display-page]="displayMode()"><router-outlet /></main>
  @if (!displayMode()) { <app-footer /> }
</div>
