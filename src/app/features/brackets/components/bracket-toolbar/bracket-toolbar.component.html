@if (embedded) {
  <div class="embedded-toolbar">
    <div class="bracket-heading">
      <p class="bracket-kicker">VISUALIZAÇÃO DE CAMPEONATO</p>
      <h1>Chaves</h1>
    </div>
    <app-select-menu
      label="Campeonato"
      [options]="tournamentOptions"
      [value]="selectedTournamentId"
      [disabled]="!ready || tournaments.length < 2"
      (valueChange)="tournamentSelected.emit($event)"
    ></app-select-menu>
  </div>
} @else {
  <app-dashboard-actions
    [displayMode]="displayMode"
    displayLink="/display/brackets"
    exitLink="/brackets"
    (fullscreenRequested)="fullscreenRequested.emit()"
  ></app-dashboard-actions>
